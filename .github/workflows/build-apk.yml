name: Build Pizza Empire APK (3D Edition)

on:
  push:
    branches: [ "claude/pizza-empire-game-dev-kyye97", "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install Android platform & build tools
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Download Three.js r128 (3D engine)
        run: |
          mkdir -p app/src/main/assets/js/engine
          echo "Downloading Three.js r128..."
          curl -fsSL \
            "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" \
            -o app/src/main/assets/js/engine/three.min.js
          SIZE=$(wc -c < app/src/main/assets/js/engine/three.min.js)
          echo "Three.js downloaded: ${SIZE} bytes"

      # Download texture assets (CC0/free) for richer visuals
      - name: Download game assets
        run: |
          mkdir -p app/src/main/assets/textures
          # Three.js example textures
          curl -fsSL "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/textures/hardwood2_diffuse.jpg" -o app/src/main/assets/textures/wood.jpg || true
          curl -fsSL "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/textures/brick_diffuse.jpg" -o app/src/main/assets/textures/brick.jpg || true
          curl -fsSL "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/textures/floor/FloorsCheckerboard_S_Diffuse.jpg" -o app/src/main/assets/textures/floor.jpg || true
          curl -fsSL "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/textures/terrain/grasslight-big.jpg" -o app/src/main/assets/textures/grass.jpg || true
          curl -fsSL "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/textures/concrete/concrete.jpg" -o app/src/main/assets/textures/concrete.jpg || true
          # Kenney.nl CC0 texture pack (zip)
          curl -fsSL "https://kenney.nl/media/pages/assets/prototype-textures/a36c7c4b24-1713278609/kenney_prototype-textures.zip" -o /tmp/textures.zip || true
          [ -f /tmp/textures.zip ] && unzip -o /tmp/textures.zip -d app/src/main/assets/textures/ || true

      - name: Download Gradle Wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          curl -fsSL \
            "https://github.com/gradle/gradle/raw/v8.7.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar

      - name: Create gradlew script
        run: |
          cat > gradlew << 'GRADLEW'
          #!/bin/sh
          APP_HOME="$(cd "$(dirname "$0")" && pwd)"
          CLASSPATH="$APP_HOME/gradle/wrapper/gradle-wrapper.jar"
          exec "$JAVA_HOME/bin/java" \
            -classpath "$CLASSPATH" \
            org.gradle.wrapper.GradleWrapperMain "$@"
          GRADLEW
          chmod +x gradlew

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Show asset sizes
        run: |
          echo "=== Asset sizes ==="
          du -sh app/src/main/assets/js/engine/three.min.js
          du -sh app/src/main/assets/
          echo "==================="

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Get APK size
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk 2>/dev/null || echo "Debug APK not found"
          ls -lh app/build/outputs/apk/release/app-release-unsigned.apk 2>/dev/null || echo "Release APK not found"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pizza-empire-3d-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: pizza-empire-3d-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: "Pizza Empire 3D v2.0.${{ github.run_number }} \U0001F355"
          body: |
            ## Pizza Empire 3D – First Person Restaurant-Crime-Game

            ### Installation
            1. `pizza-empire-3d-debug.apk` herunterladen
            2. Auf Android-Gerät übertragen
            3. Einstellungen → Sicherheit → **Unbekannte Quellen** aktivieren
            4. APK installieren und spielen!

            ---

            ### 3D Engine
            - **Three.js r128** WebGL Renderer
            - First Person Kamera (Schedule-One-Stil)
            - Virtueller Joystick links (Bewegen), Wisch rechts (Umschauen)
            - Komplette 3D-Welt: Straße, Speisesaal, Küche, Büro
            - Dynamischer Tag/Nacht-Zyklus
            - Prozedurale Texturen (Ziegel, Holz, Fliesen)
            - 3D-NPCs mit Idle-Animationen & Namensschildern

            ### Story & Gameplay
            - 🎭 5 Story-Kapitel mit Gangster-Krimi-Plot
            - 4 verschiedene Enden (ehrlich / Gang / Polizei / Weltreich)
            - 🍕 Pizza-Küche: Zutaten wählen, backen, Bewertung kassieren
            - 🔨 6 Upgrade-Typen für Ofen, Einrichtung, Speisesaal
            - 👥 3 Mitarbeiter einstellbar
            - 💾 Automatisches Speichern – Fortschritt nie verloren

            ### Charaktere (alle in 3D)
            | Charakter | Rolle |
            |-----------|-------|
            | Du | First Person Spieler |
            | Nonna | Immer in der Küche |
            | Marco Russoni | Gang-Boss (Tag 3) |
            | Inspektor Bauer | Polizei (Tag 6) |
            | Rosa | Servicekraft |
            | Kunden | Zufällige NPCs |

            Build #${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
