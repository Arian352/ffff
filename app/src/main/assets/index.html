<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pizza Empire</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ 3D CANVAS (always rendered) ============ -->
<canvas id="game-canvas"></canvas>

<!-- ============ TOUCH CONTROLS (shown only in 3D mode) ============ -->
<div id="touch-controls" class="hidden">
  <!-- Left: Virtual Joystick -->
  <div id="joystick-zone">
    <div id="joystick-base">
      <div id="joystick-thumb"></div>
    </div>
  </div>
  <!-- Right: Look area label -->
  <div id="look-zone"></div>
  <!-- Interact button (appears when near NPC/object) -->
  <div id="interact-prompt" class="hidden">
    <button id="btn-interact">&#x25CF;&nbsp;Sprechen</button>
  </div>
  <!-- Menu button bottom right -->
  <div id="hud-btn-row">
    <button id="btn-hud-day" class="hud-pill"></button>
    <button id="btn-hud-money" class="hud-pill gold"></button>
    <button id="btn-hud-menu" class="hud-pill" onclick="Game.openManagement()">&#9776; Menü</button>
  </div>
  <!-- Stars top center -->
  <div id="hud-stars-3d"></div>
  <!-- Crosshair -->
  <div id="crosshair"></div>
</div>

<!-- ============ TITELBILDSCHIRM ============ -->
<div id="screen-title" class="screen active">
  <div class="title-bg">
    <div class="title-glow"></div>
    <div class="title-city"></div>
  </div>
  <div class="title-content">
    <div class="title-pizza" id="title-pizza"></div>
    <h1 class="game-logo"><span>PIZZA</span><span class="logo-empire">EMPIRE</span></h1>
    <p class="game-tagline">Teig. Geld. Verbrechen.</p>
    <div class="title-buttons">
      <button id="btn-continue" class="btn btn-gold hidden">Weiterspielen</button>
      <button id="btn-newgame" class="btn btn-outline">Neues Spiel</button>
    </div>
    <p class="title-save-info hidden" id="title-save-info"></p>
    <div class="title-specs">
      <span>3D First Person</span><span>&middot;</span><span>Open World</span><span>&middot;</span><span>Auto-Save</span>
    </div>
  </div>
</div>

<!-- ============ LADEBILDSCHIRM ============ -->
<div id="screen-loading" class="screen">
  <div class="loading-content">
    <div class="loading-pizza" id="loading-pizza"></div>
    <div class="loading-title">PIZZA EMPIRE</div>
    <div class="loading-bar-wrap">
      <div class="loading-bar-fill" id="loading-bar"></div>
    </div>
    <div class="loading-text" id="loading-text">Welt wird geladen…</div>
  </div>
</div>

<!-- ============ STORY / DIALOG ============ -->
<div id="screen-story" class="screen">
  <div class="story-bg" id="story-bg"></div>
  <div class="story-vignette"></div>
  <div class="story-chapter" id="story-chapter"></div>
  <div class="story-box">
    <div class="story-portrait" id="story-portrait"></div>
    <div class="story-text-area">
      <div class="story-speaker" id="story-speaker"></div>
      <div class="story-text" id="story-text"></div>
      <div class="story-continue-hint" id="story-hint">Tippen zum Fortfahren&hellip;</div>
    </div>
  </div>
  <div class="story-choices hidden" id="story-choices"></div>
</div>

<!-- ============ MANAGEMENT OVERLAY ============ -->
<div id="overlay-management" class="overlay hidden">
  <div class="mgmt-panel">
    <div class="mgmt-header">
      <div class="mgmt-title">Management</div>
      <button class="mgmt-close" onclick="Game.closeManagement()">&#x2715;</button>
    </div>
    <nav class="mgmt-tabs" id="mgmt-tabs">
      <button class="mgmt-tab active" data-tab="service">&#127829; Aufträge</button>
      <button class="mgmt-tab" data-tab="shop">&#128722; Einkauf</button>
      <button class="mgmt-tab" data-tab="build">&#128296; Umbau</button>
      <button class="mgmt-tab" data-tab="office">&#128196; Büro</button>
    </nav>
    <div class="mgmt-body" id="mgmt-body"></div>
  </div>
</div>

<!-- ============ PIZZA-ZUBEREITUNG (Overlay) ============ -->
<div id="overlay-kitchen" class="overlay hidden">
  <div class="kitchen-panel">
    <div class="kitchen-order" id="kitchen-order"></div>
    <div class="kitchen-pizza-wrap"><div id="kitchen-pizza"></div></div>
    <div class="kitchen-ingredients" id="kitchen-ingredients"></div>
    <div class="kitchen-actions">
      <button class="btn btn-small btn-outline" id="btn-kitchen-reset">Neu belegen</button>
      <button class="btn btn-small btn-gold" id="btn-kitchen-bake">In den Ofen</button>
      <button class="btn btn-small btn-outline" id="btn-kitchen-cancel">Zurück</button>
    </div>
  </div>
</div>

<!-- ============ TAGESABSCHLUSS ============ -->
<div id="overlay-summary" class="overlay hidden">
  <div class="summary-panel" id="summary-panel"></div>
</div>

<!-- ============ TOAST ============ -->
<div id="toast-wrap"></div>

<!-- ============ SCRIPTS ============ -->
<!-- Three.js WebGL engine -->
<script src="js/engine/three.min.js"></script>
<!-- Game data / portraits -->
<script src="js/portraits.js"></script>
<!-- 3D Engine modules (loaded after Three.js) -->
<script src="js/engine/world.js"></script>
<script src="js/engine/player.js"></script>
<script src="js/engine/npcs.js"></script>
<!-- City & Open World -->
<script src="js/engine/city.js"></script>
<!-- AI citizens with schedules -->
<script src="js/engine/ai.js"></script>
<!-- Secret Lab -->
<script src="js/engine/secretlab.js"></script>
<!-- Dialogue system -->
<script src="js/dialogue.js"></script>
<!-- Story engine -->
<script src="js/story.js"></script>
<!-- Main game logic -->
<script src="js/game.js"></script>
</body>
</html>
